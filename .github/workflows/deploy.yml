name: deploy-oss

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: 安装并配置 ossutil
        run: |
          sudo -v ; curl -fsS https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config -e oss-cn-beijing.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      - name: 上传到 OSS
        run: ossutil cp -rf dist/ oss://zfqt/
